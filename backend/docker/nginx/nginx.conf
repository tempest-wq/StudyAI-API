events {
    worker_connections 1024;
}

http {
    upstream kong_gateway {
        server kong:8000;
    }
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://kong_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}