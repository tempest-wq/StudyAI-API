services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: studyai_fastapi
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - postgres
      - redis

  kong:
    image: kong:latest
    container_name: studyai_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
    volumes:
      - ./docker/kong/kong.yaml:/kong/declarative/kong.yaml
    expose:
      - "8000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: studyai_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kong

  postgres:
    image: postgres:16-alpine
    container_name: studyai_postgres
    environment:
      POSTGRES_USER: studyai_admin
      POSTGRES_PASSWORD: studyai_pwd
      POSTGRES_DB: studyai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: studyai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: