services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: studyai_fastapi
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    expose:
      - "8000"

  kong:
    image: kong:latest
    container_name: studyai_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
    volumes:
      - ./docker/kong/kong.yaml:/kong/declarative/kong.yaml
    expose:
      - "8000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: studyai_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kong